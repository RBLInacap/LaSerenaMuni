{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}La Serena{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <style>
        body {
            background: #f5f3f0;
            color: #3a3a3a;
            font-family: Georgia, 'Times New Roman', serif;
            margin: 0;
        }
        .navbar {
            background: #7a2e36 !important;
            border-bottom: 3px solid #f5f3f0;
            box-shadow: 0 2px 8px rgba(122, 46, 54, 0.15);
            padding: 0.5rem 0;
            position: sticky;
            top: 0;
            z-index: 1030;
        }
        .navbar-brand, .nav-link {
            color: #f5f3f0 !important;
        }
        .navbar-nav {
            gap: 0.25rem;
        }
        .nav-link {
            padding: 0.65rem 0.95rem !important;
            border-radius: 0.45rem;
            font-weight: 600;
        }
        .nav-link:hover {
            color: #ffd4d4 !important;
            background: rgba(255, 255, 255, 0.08);
        }
        .brand-logo {
            width: 150px;
            height: 150px;
            object-fit: contain;
            padding: 6px;
            margin-right: 12px;
        }
        .hero-wrap {
            background: linear-gradient(135deg, #f5f3f0 0%, #f9f7f4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 0 60px;
        }
        .escudo {
            width: 420px;
            max-width: 85vw;
            margin: 0 auto 20px auto;
            display: block;
            filter: brightness(0) invert(1);
        }
        .titulo-principal {
            font-size: clamp(4rem, 8vw, 12rem);
            line-height: 0.85;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #7a2e36;
            text-transform: uppercase;
            text-align: center;
            margin: 0;
        }
        .subtitulo-principal {
            font-size: clamp(2rem, 4vw, 6rem);
            line-height: 0.9;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #7a2e36;
            text-transform: uppercase;
            text-align: center;
            margin-top: 0.2em;
        }
        .btn-municipal {
            background: #7a2e36;
            border: none;
            color: #f5f3f0;
            font-weight: 700;
            padding: 0.8rem 1.5rem;
            border-radius: 0.5rem;
            text-transform: uppercase;
        }
        .btn-municipal:hover {
            background: #5a1f26;
            color: #f5f3f0;
        }
        .btn-outline-municipal {
            border: 2px solid #7a2e36;
            color: #7a2e36;
            background: transparent;
            font-weight: 700;
        }
        .btn-outline-municipal:hover {
            background: #7a2e36;
            color: #f5f3f0;
        }
        @media (max-width: 768px) {
            .titulo-principal {
                letter-spacing: 0.02em;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark" aria-label="Menú principal">
            <div class="container">
                <a class="navbar-brand fw-bold d-flex align-items-center" href="/">
                    <img src="{% static 'img/logo.png' %}" alt="Logo Municipalidad de La Serena" class="brand-logo">
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto align-items-center">
                        <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="/solicitudes/">Solicitudes</a></li>
                        <li class="nav-item"><a class="nav-link" href="/servicios/">Servicios</a></li>
                        <li class="nav-item"><a class="nav-link" href="/acerca/">Acerca</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="hero-wrap">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-4" style="background: #7a2e36; color: #f5f3f0; border-top: 3px solid #e8e5e0;">
        <div class="container">
            <strong>Municipalidad de La Serena</strong>
            <div class="mt-2">Sistema de solicitudes ciudadanas</div>
        </div>
    </footer>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
